name: Build and Release Isotope Logistics

on:
  push:
    branches:
      - "Neo/1.21.1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Isotope Logistics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x NeoForge/gradlew

      - name: Fetch compile-only integration jars
        shell: bash
        run: |
          set -euo pipefail

          # These jars are compile-only and are never bundled into the addon.
          integration_dir='ci-libs'
          mkdir -p "$integration_dir"

          fetch_modrinth_jar() {
            local project="$1"
            local version="$2"
            local output="$3"
            local url

            url="$(curl --fail --silent --show-error --location --get \
              "https://api.modrinth.com/v2/project/${project}/version" \
              --data-urlencode 'loaders=["neoforge"]' \
              --data-urlencode 'game_versions=["1.21.1"]' \
              | jq -r --arg version "$version" \
                '.[] | select(.version_number == $version) | .files[] | select(.filename | endswith(".jar")) | .url' \
              | sed -n '1p')"

            test -n "$url"
            curl --fail --silent --show-error --location "$url" --output "$integration_dir/$output"
            test -s "$integration_dir/$output"
          }

          fetch_modrinth_jar ae2 19.2.17 appliedenergistics2-19.2.17.jar
          fetch_modrinth_jar refined-storage 2.0.9 refinedstorage-neoforge-2.0.9.jar
          fetch_modrinth_jar jei 19.39.0.370 jei-1.21.1-neoforge-19.39.0.370.jar

      - name: Read Isotope Logistics version
        id: version
        shell: bash
        run: |
          minecraft_version="$(awk -F= '$1 == "minecraft_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          mod_version="$(awk -F= '$1 == "mod_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          test -n "$minecraft_version"
          test -n "$mod_version"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${mod_version}" >> "$GITHUB_OUTPUT"
          echo "jar=build/libs/IsotopeLogistics-${mod_version}.jar" >> "$GITHUB_OUTPUT"

      - name: Build Isotope Logistics
        run: ./NeoForge/gradlew clean build --no-daemon --console=plain "-Pintegration_mods_dir=${GITHUB_WORKSPACE}/ci-libs"

      - name: Verify Isotope Logistics JAR
        run: |
          test -f "${{ steps.version.outputs.jar }}"
          echo "Built ${{ steps.version.outputs.jar }}"

      - name: Check for existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.release_tag }}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.release_tag }} already exists; skipping release creation."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Isotope Logistics release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.release_tag }}" \
            "${{ steps.version.outputs.jar }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Isotope Logistics ${{ steps.version.outputs.mod_version }}" \
            --generate-notes \
            --latest
